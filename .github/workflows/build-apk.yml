name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          
          if [ -z "${JAVA_HOME}" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi

          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "${JAVA_VERSION_OUTPUT}" | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          
          if [ -z "${JAVA_MAJOR}" ]; then
            echo "ERROR: Could not detect active Java major version." >&2
            exit 1
          fi
          
          echo "Detected Java major version: ${JAVA_MAJOR}"
          
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "ERROR: Java major version ${JAVA_MAJOR} is lower than required version 17." >&2
            exit 1
          fi
          
          echo "Java environment verified successfully (Java ${JAVA_MAJOR} >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare build environment & keystore
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

          KEYSTORE_PATH="./debug.keystore"
          if [ -f "${KEYSTORE_PATH}" ]; then
            echo "Debug keystore already exists at ${KEYSTORE_PATH}."
          elif [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug keystore from base64..."
            base64 -d debug.keystore.base64 > "${KEYSTORE_PATH}" || true
          fi

          if [ ! -f "${KEYSTORE_PATH}" ] || [ ! -s "${KEYSTORE_PATH}" ]; then
            echo "Generating temporary debug keystore..."
            "${JAVA_HOME}/bin/keytool" -genkey -v \
              -keystore "${KEYSTORE_PATH}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "${KEYSTORE_PATH}" ]; then
            echo "ERROR: Failed to create or find debug keystore at ${KEYSTORE_PATH}." >&2
            exit 1
          fi
          echo "Debug keystore ready."

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "ERROR: Expected debug APK not found at ${EXPECTED_APK}." >&2
            echo "Searching app/build/outputs/apk for generated files..." >&2
            find app/build/outputs/apk -name "*.apk" -type f || true
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "ERROR: APK file is empty: ${EXPECTED_APK}" >&2
            exit 1
          fi

          APK_SIZE=$(stat -c%s "${EXPECTED_APK}" 2>/dev/null || stat -f%z "${EXPECTED_APK}")
          echo "Verified APK: ${EXPECTED_APK} (Size: ${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "${TEMP_RELEASE_DIR}"

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "${RAW_REPO_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "${SAFE_REPO_NAME}" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          RELEASE_ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_ASSET_PATH="${TEMP_RELEASE_DIR}/${RELEASE_ASSET_NAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "${RELEASE_ASSET_PATH}"

          if [ ! -f "${RELEASE_ASSET_PATH}" ] || [ ! -s "${RELEASE_ASSET_PATH}" ]; then
            echo "ERROR: Release asset preparation failed: ${RELEASE_ASSET_PATH}" >&2
            exit 1
          fi

          echo "Release asset prepared: ${RELEASE_ASSET_PATH}"
          echo "release_asset_path=${RELEASE_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "release_asset_name=${RELEASE_ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_PATH="${{ steps.prepare_asset.outputs.release_asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.release_asset_name }}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "ERROR: Prepared release asset is missing or empty." >&2
            exit 1
          fi

          RELEASE_NOTES=$(cat <<EOF
          ### 📱 Automated Debug APK Build

          - **Build Type**: Debug APK (built by GitHub Actions)
          - **Run Number**: #${GITHUB_RUN_NUMBER}
          - **Run Attempt**: #${GITHUB_RUN_ATTEMPT}
          - **Target Commit**: \`${GITHUB_SHA}\`
          - **Asset**: \`${ASSET_NAME}\`

          > **Note**: This is an automatically generated debug APK intended for testing and review. It is not a Play Store production release and is signed with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release: ${RELEASE_TAG}..."
          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.release_asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "========================================================"
            echo "🎉 GitHub Release Published Successfully!"
            echo "Release Tag:   ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "APK Asset:     ${ASSET_NAME}"
            echo "Release URL:   https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "========================================================"

            gh release view "${RELEASE_TAG}" || true

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Release Summary

          ✅ **Debug APK built successfully!**
          ✅ **GitHub Release Published:** [${RELEASE_TITLE}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG})
          📦 **Direct Download Asset:** \`${ASSET_NAME}\` (available in the Release Assets section)
          💾 **Backup Artifact:** \`app-debug-apk\` is also preserved in GitHub Actions artifacts.
          EOF
          else
            echo "========================================================"
            echo "⚠️ Warning: GitHub Release publishing failed or was skipped."
            echo "The Debug APK build succeeded and is safely uploaded to Actions artifacts."
            echo "Artifact Name: app-debug-apk"
            echo "========================================================"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Debug APK Build Summary

          ✅ **Debug APK built successfully!**
          ⚠️ **GitHub Release Publishing Failed or Skipped.**
          💾 **Download Option:** Download the build artifact named **\`app-debug-apk\`** directly from the summary section of this GitHub Actions run.
          EOF
          fi
