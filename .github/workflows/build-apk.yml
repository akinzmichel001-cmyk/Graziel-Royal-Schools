name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          echo "=== Accepting Android SDK Licenses ==="
          yes | sdkmanager --licenses || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure required build files (.env & debug keystore)
        run: |
          echo "=== Setting up Build Prerequisites ==="
          if [ ! -f "./.env" ]; then
            echo "Creating fallback .env file..."
            touch ./.env
            if [ -f "./.env.example" ]; then
              cp ./.env.example ./.env
            fi
          fi

          if [ ! -f "./app/.env" ]; then
            cp ./.env ./app/.env || true
          fi

          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          elif [ -f "./debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore || true
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug.keystore using keytool..."
            "${JAVA_HOME}/bin/keytool" -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be verified." >&2
            exit 1
          fi

          echo "Build prerequisites verified successfully."

      - name: Build debug APK
        run: |
          echo "=== Executing Debug APK Build ==="
          gradle :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Verify debug APK output
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "Error: Expected debug APK not found at ${EXPECTED_APK}" >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "Error: Generated APK at ${EXPECTED_APK} is empty." >&2
            exit 1
          fi

          echo "Verified debug APK exists: ${EXPECTED_APK}"
          ls -lh "${EXPECTED_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing Release Asset ==="
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          TEMP_ASSET_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "${TEMP_ASSET_DIR}"

          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "${RAW_REPO_NAME}" ]; then
            RAW_REPO_NAME="graziel-royal-schools"
          fi
          SAFE_REPO_NAME=$(echo "${RAW_REPO_NAME}" | tr -cs 'a-zA-Z0-9._-' '-' | sed 's/^-*//;s/-*$//')
          
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_NAME}"

          cp "${ORIGINAL_APK}" "${ASSET_PATH}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "Error: Failed to prepare release asset at ${ASSET_PATH}" >&2
            exit 1
          fi

          echo "Prepared release asset: ${ASSET_NAME}"
          echo "Asset path: ${ASSET_PATH}"

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ]; then
            echo "Warning: Release asset is missing at: ${ASSET_PATH}"
            exit 0
          fi

          RELEASE_TAG="v1.0.0-build-${{ github.run_number }}"
          RELEASE_TITLE="Graziel Royal Schools - Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          echo "Creating Release with Tag: ${RELEASE_TAG}"

          NOTES="### Graziel Royal Schools App Build #${{ github.run_number }}
          - Automated Debug APK Build
          - Commit: \`${{ github.sha }}\`"

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes "${NOTES}" \
            --target "${TARGET_COMMIT}" || true

      - name: Summary
        if: always()
        run: |
          echo "### 📱 Graziel Royal Schools Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "The APK build process completed. If GitHub Releases is enabled, the release has been created. The debug APK is also available in the **Artifacts** section as \`app-debug-apk\`." >> "$GITHUB_STEP_SUMMARY"
